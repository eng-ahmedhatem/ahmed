
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf7">
<title>The Fascia Fix — Video & Steps Library</title>
<style>
:root{
  --bg:#fbfaf7;
  --surface:#fff;
  --ink:#11110f;
  --muted:#716c63;
  --gold:#c89d48;
  --gold-deep:#a87b2f;
  --gold-soft:#f2ead9;
  --line:#ebe6dc;
  --dark:#0b0b0a;
  --shadow:0 22px 60px rgba(27,22,13,.08);
  --r:22px;
  --max:1240px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
button{cursor:pointer}
img{display:block;width:100%}
.shell{width:min(calc(100% - 32px),var(--max));margin:auto}

/* top */
.notice{
  background:#c59a47;color:#fff;text-align:center;
  padding:6px 12px;font-size:10px;letter-spacing:.025em
}
.header{
  position:sticky;top:0;z-index:80;
  background:rgba(251,250,247,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line)
}
.header-in{
  height:72px;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:22px
}
.logo{display:flex;align-items:center;gap:10px;width:max-content}
.logo-mark{
  width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(200,157,72,.58);
  background:#fff;display:grid;place-items:center
}
.logo-mark:before{
  content:"";width:17px;height:17px;border:1px solid var(--gold);
  border-radius:50%;box-shadow:0 0 0 4px rgba(200,157,72,.08)
}
.logo-copy strong{display:block;font-size:12px;letter-spacing:.16em}
.logo-copy small{display:block;color:var(--gold);font-size:8px;letter-spacing:.13em;margin-top:3px}
.nav{display:flex;align-items:center;gap:28px}
.nav a{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;position:relative
}
.nav a:after{
  content:"";position:absolute;height:1px;background:var(--gold);
  left:50%;right:50%;bottom:-9px;transition:.2s ease
}
.nav a:hover:after{left:0;right:0}
.actions{justify-self:end;display:flex;align-items:center;gap:8px}
.btn,.icon-btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:999px;transition:.22s ease
}
.btn{padding:11px 16px;font-size:12px;font-weight:700}
.icon-btn{width:42px;height:42px}
.btn:hover,.icon-btn:hover{transform:translateY(-1px);border-color:#d7c49a}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:var(--gold);border-color:var(--gold);color:#171109}

/* hero */
.hero{padding:34px 0 24px}
.hero-wrap{
  display:grid;grid-template-columns:.88fr 1.12fr;gap:16px;
}
.hero-copy{
  min-height:500px;background:#fff;border:1px solid var(--line);
  border-radius:26px;padding:46px;display:flex;flex-direction:column;justify-content:center
}
.eyebrow{
  color:var(--gold-deep);font-size:9px;font-weight:800;text-transform:uppercase;
  letter-spacing:.17em
}
.hero h1{
  font-size:clamp(3rem,5.8vw,5.4rem);
  line-height:.9;letter-spacing:-.055em;margin:15px 0 20px;font-weight:700
}
.hero h1 span{display:block;color:var(--gold);font-weight:450}
.hero p{color:var(--muted);font-size:.98rem;line-height:1.72;max-width:530px;margin:0}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}
.hero-aside{
  display:grid;grid-template-columns:1.35fr .65fr;grid-template-rows:1fr 1fr;gap:12px;
  min-height:500px
}
.photo{
  position:relative;overflow:hidden;border-radius:26px;background:#ddd
}
.photo.main{grid-row:1/3}
.photo img{height:100%;object-fit:cover;transition:.55s ease}
.photo:hover img{transform:scale(1.045)}
.photo-shade{
  position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.5),transparent 50%)
}
.photo-label{
  position:absolute;left:16px;right:16px;bottom:14px;color:white
}
.photo-label small{
  display:block;color:#e7cb8b;font-size:9px;text-transform:uppercase;letter-spacing:.13em;font-weight:800
}
.photo-label strong{display:block;font-size:.9rem;margin-top:4px}
.hero-note{
  margin-top:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)
}
.hero-note-grid{display:grid;grid-template-columns:1.3fr .7fr .7fr}
.hero-note-item{padding:18px 22px;border-right:1px solid var(--line)}
.hero-note-item:first-child{padding-left:0}
.hero-note-item:last-child{border-right:0}
.hero-note-item small{display:block;color:var(--gold-deep);font-size:9px;text-transform:uppercase;letter-spacing:.13em;font-weight:800}
.hero-note-item strong{display:block;margin-top:5px;font-size:.95rem}
.hero-note-item span{display:block;color:var(--muted);font-size:.76rem;margin-top:3px}

/* sections */
.section{padding:64px 0}
.section.white{background:#fff}
.head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin-bottom:26px
}
.head h2{font-size:clamp(2rem,4vw,3.5rem);letter-spacing:-.045em;margin:8px 0 0}
.head p{max-width:500px;color:var(--muted);font-size:.92rem;line-height:1.68;margin:0}

/* finder */
.finder-shell{
  position:sticky;top:72px;z-index:45;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:18px;
  padding:10px;margin-bottom:18px
}
.finder{
  display:grid;grid-template-columns:minmax(270px,1fr) auto;gap:10px;align-items:center
}
.search-wrap{position:relative}
.search-wrap:before{
  content:"⌕";position:absolute;left:15px;top:50%;transform:translateY(-52%);
  color:#8a8478;font-size:19px
}
.search{
  width:100%;height:46px;border:1px solid var(--line);border-radius:999px;
  background:#fff;padding:0 18px 0 42px;outline:none
}
.search:focus{border-color:#d4bb80;box-shadow:0 0 0 4px rgba(200,157,72,.07)}
.filters{display:flex;gap:7px;overflow:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{
  white-space:nowrap;border:1px solid var(--line);background:#fff;
  padding:9px 12px;border-radius:999px;font-size:11px;color:#59544c
}
.filter:hover{border-color:#d8c79f}
.filter.active{background:var(--ink);border-color:var(--ink);color:#fff}

/* cards */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{
  background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;
  transition:.28s ease;cursor:pointer;position:relative
}
.card:before{
  content:"";position:absolute;left:0;right:100%;bottom:0;height:2px;background:var(--gold);z-index:3;
  transition:.32s ease
}
.card:hover:before{right:0}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.card-media{height:220px;position:relative;overflow:hidden}
.card-media img{height:100%;object-fit:cover;transition:.5s ease}
.card:hover .card-media img{transform:scale(1.05)}
.badge{
  position:absolute;left:13px;top:13px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);padding:6px 9px;border-radius:999px;
  font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:800
}
.time{
  position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.35);
  color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:999px;
  padding:5px 8px;font-size:9px;backdrop-filter:blur(6px)
}
.card-body{padding:19px}
.card-meta{color:var(--gold-deep);font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.card h3{font-size:1.32rem;line-height:1.1;letter-spacing:-.025em;margin:8px 0 8px}
.card p{font-size:.82rem;color:var(--muted);line-height:1.58;margin:0}
.card-foot{
  margin-top:16px;padding-top:13px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center
}
.card-foot span:first-child{font-size:11px;font-weight:800}
.arrow{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#f3efe7;
  transition:.2s ease
}
.card:hover .arrow{background:var(--gold);transform:translateX(3px)}
.empty{grid-column:1/-1;padding:46px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted)}

/* spotlight */
.spotlight{
  display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-bottom:18px
}
.spot{
  position:relative;min-height:355px;border-radius:22px;overflow:hidden;background:#111;cursor:pointer
}
.spot img{position:absolute;inset:0;height:100%;object-fit:cover;transition:.55s ease}
.spot:hover img{transform:scale(1.04)}
.spot:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.72),rgba(0,0,0,.03) 65%)}
.spot-content{position:absolute;z-index:2;left:20px;right:20px;bottom:18px;color:#fff}
.spot-content small{display:block;color:#e5c984;font-size:9px;text-transform:uppercase;letter-spacing:.13em;font-weight:800}
.spot-content h3{font-size:1.75rem;margin:7px 0 7px;letter-spacing:-.03em}
.spot-content p{font-size:.82rem;line-height:1.55;color:#ddd8cf;margin:0;max-width:500px}
.spot-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:11px}
.play{
  width:44px;height:44px;border:1px solid rgba(255,255,255,.35);
  border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);
  backdrop-filter:blur(7px);transition:.2s ease
}
.spot:hover .play{background:var(--gold);border-color:var(--gold);color:#111}

/* browse */
.browse{background:#0b0b0a;color:#fff;padding:66px 0}
.browse .head p{color:#a39d93}
.browse-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.topic{
  min-height:180px;border:1px solid rgba(255,255,255,.1);border-radius:18px;
  padding:20px;background:rgba(255,255,255,.025);
  display:flex;flex-direction:column;justify-content:space-between;transition:.23s ease
}
.topic:hover{transform:translateY(-4px);background:rgba(255,255,255,.06);border-color:rgba(200,157,72,.28)}
.topic-num{color:var(--gold);font-size:1.15rem;font-weight:800}
.topic h3{font-size:1.1rem;margin:0 0 5px}
.topic p{font-size:.78rem;line-height:1.55;color:#aaa49b;margin:0}

/* detail */
.detail{padding:34px 0 76px}
.back{
  border:0;background:transparent;padding:8px 0;margin-bottom:14px;
  color:#666159;font-size:12px
}
.detail-top{
  display:grid;grid-template-columns:1.05fr .95fr;background:#fff;
  border:1px solid var(--line);border-radius:24px;overflow:hidden;
  box-shadow:0 16px 48px rgba(25,20,12,.05)
}
.detail-img{min-height:450px}
.detail-img img{height:100%;object-fit:cover}
.detail-copy{padding:42px;display:flex;flex-direction:column;justify-content:center}
.detail-copy h1{
  font-size:clamp(2.6rem,5vw,4.7rem);line-height:.93;letter-spacing:-.05em;
  margin:13px 0 17px
}
.detail-copy p{color:var(--muted);font-size:.92rem;line-height:1.68;margin:0}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}
.pill{padding:7px 9px;border-radius:999px;background:#f4efe6;color:#5f594e;font-size:10px}
.detail-grid{
  display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;margin-top:16px
}
.stack{display:grid;gap:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}
.panel-label{color:var(--gold-deep);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.13em;margin-bottom:7px}
.panel h2{font-size:1.45rem;letter-spacing:-.02em;margin:0 0 11px}
.panel p{color:var(--muted);font-size:.86rem;line-height:1.6}
.video{
  aspect-ratio:16/9;border-radius:15px;overflow:hidden;position:relative;background:#111
}
.video img{height:100%;object-fit:cover;opacity:.74}
.video:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.16)}
.video-play{position:absolute;inset:0;z-index:2;display:grid;place-items:center}
.video-play button{
  width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.42);
  background:rgba(0,0,0,.22);color:#fff;font-size:17px;transition:.2s ease
}
.video-play button:hover{background:var(--gold);border-color:var(--gold);color:#111;transform:scale(1.06)}
.steps{display:grid}
.step{display:grid;grid-template-columns:38px 1fr;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.no{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:var(--gold-soft);color:#805e20;font-size:11px;font-weight:800
}
.step strong{display:block;font-size:.84rem;margin-bottom:2px}
.step span{display:block;color:var(--muted);font-size:.79rem;line-height:1.5}
.note{border-left:3px solid var(--gold);background:#f7f2e8;padding:14px 15px;border-radius:0 11px 11px 0;color:#5c574f;font-size:.82rem;line-height:1.55}
.related-list{display:grid;gap:7px}
.related{
  width:100%;display:grid;grid-template-columns:46px 1fr auto;gap:9px;align-items:center;
  padding:7px;background:#fcfbf8;border:1px solid var(--line);border-radius:13px;text-align:left;transition:.18s ease
}
.related:hover{transform:translateX(3px);border-color:#d8c79d}
.related img{width:46px;height:46px;border-radius:9px;object-fit:cover}
.related strong{display:block;font-size:.75rem}
.related span{display:block;color:var(--muted);font-size:.66rem;margin-top:2px}
.product{display:grid;grid-template-columns:84px 1fr;gap:11px;align-items:center}
.product img{width:84px;height:104px;object-fit:cover;border-radius:11px}
.product p{font-size:.72rem;margin:4px 0 9px}
.linkbox{background:#f5f0e6}
.code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  background:#fff;border:1px solid var(--line);border-radius:9px;
  padding:9px 10px;font-size:10px;overflow:auto;margin-bottom:11px
}

/* footer */
.footer{background:#080807;color:#fff;padding:44px 0 24px}
.footer-grid{display:grid;grid-template-columns:1.3fr .7fr .7fr;gap:28px}
.footer p,.footer a{color:#928d84;font-size:.76rem}
.footer h4{font-size:.92rem;margin:0 0 10px}
.footer-links{display:grid;gap:6px}
.foot-bottom{margin-top:28px;padding-top:15px;border-top:1px solid rgba(255,255,255,.1);color:#66625d;font-size:.68rem}

/* reveal */
.reveal{opacity:0;transform:translateY(12px);transition:.5s ease}
.reveal.show{opacity:1;transform:none}
.toast{
  position:fixed;left:50%;bottom:18px;z-index:100;
  transform:translate(-50%,14px);background:#111;color:#fff;
  border-radius:999px;padding:10px 14px;font-size:11px;opacity:0;transition:.2s ease
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:980px){
  .nav{display:none}
  .header-in{grid-template-columns:1fr auto}
  .actions{grid-column:2}
  .hero-wrap{grid-template-columns:1fr}
  .hero-copy{min-height:auto}
  .hero-aside{min-height:420px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .browse-grid{grid-template-columns:repeat(2,1fr)}
  .detail-top,.detail-grid{grid-template-columns:1fr}
}
@media(max-width:650px){
  .shell{width:min(calc(100% - 22px),var(--max))}
  .notice{font-size:8px}
  .header-in{height:64px}
  .actions .btn{display:none}
  .hero{padding:16px 0 18px}
  .hero-copy{padding:27px;border-radius:20px}
  .hero h1{font-size:3.15rem}
  .hero-aside{grid-template-columns:1fr 1fr;grid-template-rows:270px 150px;min-height:auto}
  .photo.main{grid-column:1/3;grid-row:auto}
  .photo{border-radius:18px}
  .photo-label{left:11px;right:11px;bottom:10px}
  .hero-note-grid{grid-template-columns:1fr}
  .hero-note-item,.hero-note-item:first-child{padding:15px 0;border-right:0;border-bottom:1px solid var(--line)}
  .hero-note-item:last-child{border-bottom:0}
  .section{padding:48px 0}
  .head{display:block}
  .head p{margin-top:10px}
  .finder-shell{top:64px;margin-left:-4px;margin-right:-4px}
  .finder{grid-template-columns:1fr}
  .spotlight{grid-template-columns:1fr}
  .spot{min-height:310px}
  .grid{grid-template-columns:1fr}
  .browse-grid{grid-template-columns:1fr}
  .topic{min-height:150px}
  .detail{padding-top:18px}
  .detail-img{min-height:310px}
  .detail-copy{padding:26px}
  .detail-copy h1{font-size:3rem}
  .panel{padding:18px}
  .footer-grid{grid-template-columns:1fr}
}

/* refined resource product + continue learning */
.product-feature{
  display:grid;
  grid-template-columns:180px minmax(0,1fr);
  gap:22px;
  align-items:center;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(135deg,#fbf8f1,#fff);
  padding:16px;
}
.product-feature-media{
  min-height:190px;
  border-radius:15px;
  overflow:hidden;
  background:#eee8dc;
}
.product-feature-media img{
  width:100%;
  height:100%;
  min-height:190px;
  object-fit:cover;
}
.product-feature-copy small{
  display:block;
  color:var(--gold-deep);
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.14em;
  margin-bottom:7px;
}
.product-feature-copy h3{
  margin:0 0 8px;
  font-size:1.35rem;
  letter-spacing:-.025em;
}
.product-feature-copy p{
  margin:0 0 14px;
  font-size:.82rem;
  line-height:1.55;
}
.product-feature-meta{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.product-feature-meta span{
  padding:6px 8px;
  background:#f2ebdc;
  border-radius:999px;
  color:#6b614e;
  font-size:9px;
}
.continue-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.continue-card{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);
  border-radius:16px;
  overflow:hidden;
  color:#fff;
  text-align:left;
  padding:0;
  transition:.2s ease;
}
.continue-card:hover{
  transform:translateY(-3px);
  border-color:rgba(200,157,72,.35);
  background:rgba(255,255,255,.07);
}
.continue-card img{
  width:100%;
  height:110px;
  object-fit:cover;
}
.continue-card div{
  padding:12px;
}
.continue-card small{
  display:block;
  color:#d9bd79;
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:.12em;
  margin-bottom:4px;
}
.continue-card strong{
  display:block;
  font-size:.78rem;
  line-height:1.35;
}
.quickfacts{
  display:grid;
  gap:10px;
}
.fact{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--line);
  font-size:.78rem;
}
.fact:last-child{border-bottom:0}
.fact span{color:var(--muted)}
.fact strong{text-align:right}
@media(max-width:650px){
  .product-feature{grid-template-columns:1fr}
  .product-feature-media{min-height:220px}
  .product-feature-media img{min-height:220px}
  .continue-grid{grid-template-columns:1fr}
  .continue-card{display:grid;grid-template-columns:95px 1fr}
  .continue-card img{height:100%;min-height:88px}
}


/* ===== Premium refinement layer ===== */
:root{
  --bg:#f8f6f1;
  --surface:#fff;
  --ink:#141310;
  --muted:#777168;
  --gold:#b98a34;
  --gold-deep:#8f6825;
  --gold-soft:#f4ecdd;
  --line:#e8e2d7;
  --shadow:0 26px 70px rgba(35,27,15,.09);
  --shadow-soft:0 12px 34px rgba(35,27,15,.055);
}
body{
  background:
    radial-gradient(circle at 12% 1%,rgba(185,138,52,.055),transparent 24rem),
    var(--bg);
}
.shell{width:min(calc(100% - 40px),1280px)}
.notice{
  min-height:30px;display:flex;align-items:center;justify-content:center;gap:10px;
  background:#a7792b;padding:6px 14px;font-size:9px;text-transform:uppercase;
  letter-spacing:.12em;font-weight:700
}
.notice i{display:block;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.65)}
.header{background:rgba(248,246,241,.91);border-bottom-color:rgba(57,48,34,.08)}
.header-in{height:78px}
.logo-mark{

}

}

.search{height:48px;background:#fbfaf7;border-color:#e9e3d8}
.filters{padding-right:2px}

.spotlight{grid-template-columns:1.18fr .82fr;gap:12px;margin:22px 0 18px}

.spot-content{left:24px;right:24px;bottom:22px}
.spot-content h3{font-size:1.9rem;max-width:520px}
.spot-content p{font-size:.78rem;max-width:470px}
.spot-foot{border-top:1px solid rgba(255,255,255,.16);padding-top:12px}

.grid{gap:14px}
.card{
  border-radius:18px;border-color:rgba(53,43,29,.09);
  box-shadow:0 4px 14px rgba(30,24,14,.025)
}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 55px rgba(34,26,14,.08)}

.card-media{height:auto;aspect-ratio:1.42/1}

.card-meta{font-size:8px;letter-spacing:.14em}

.arrow{width:31px;height:31px;font-size:12px}
.badge{top:12px;left:12px;font-size:8px;padding:6px 8px}
.time{font-size:8px;padding:5px 8px}
.empty{background:#fbfaf7}
.empty strong,.empty span{display:block}
.empty strong{color:var(--ink);font-size:1rem}.empty span{font-size:.76rem;margin-top:5px}

/* resource page refinement */
.detail{padding:24px 0 88px}
.back{margin:2px 0 14px;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.detail-top{
  grid-template-columns:1.08fr .92fr;border-radius:28px;
  border-color:rgba(51,42,29,.08);box-shadow:var(--shadow-soft)
}
.detail-img{min-height:510px;overflow:hidden}
.detail-img img{transition:transform .8s ease}.detail-top:hover .detail-img img{transform:scale(1.018)}
.detail-copy{padding:48px}
.detail-kicker{
  display:flex;align-items:center;gap:9px;color:var(--gold-deep);

}
.detail-kicker i{width:3px;height:3px;background:var(--gold);border-radius:50%}

.pill{font-size:9px;padding:7px 10px}
.detail-start{

  display:flex;justify-content:space-between;align-items:center;
  font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:800
}
.detail-start b{
  width:34px;height:34px;border:1px solid var(--line);border-radius:50%;
  display:grid;place-items:center;font-size:13px;transition:.2s ease
}
.detail-start:hover b{background:var(--gold);border-color:var(--gold)}
.detail-grid{grid-template-columns:minmax(0,1fr) 330px;gap:14px;margin-top:14px}
.stack{gap:12px}.panel{border-radius:18px;padding:24px;border-color:rgba(52,43,29,.09)}
.panel-label{font-size:8px;letter-spacing:.14em}
.panel h2{font-size:1.5rem}
.panel-headline{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:13px}
.panel-headline h2{margin:0}
.watch-chip{
  flex:0 0 auto;padding:7px 9px;background:var(--gold-soft);color:var(--gold-deep);
  border-radius:999px;font-size:9px;font-weight:800
}
.video{border-radius:17px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.video-play button{width:70px;height:70px;background:rgba(0,0,0,.3);backdrop-filter:blur(9px)}
.steps{position:relative}
.step{grid-template-columns:44px 1fr;padding:16px 0}
.no{width:35px;height:35px;background:#f5efe4;border:1px solid #eadcc3}
.step strong{font-size:.87rem}.step span{font-size:.77rem;line-height:1.6}
.note{background:#f8f4eb;border-left-width:2px;padding:16px}
.related{padding:9px;border-radius:12px;background:#fdfcf9}
.related img{width:50px;height:50px}
.product-feature{border-radius:17px;background:linear-gradient(135deg,#f8f3e9,#fff)}
.product-feature-media{background:#eee5d5}
.product-feature-copy h3{font-size:1.45rem}
.continue-card{border-radius:13px}
.quickfacts{gap:0}
.fact{padding:12px 0;font-size:.74rem}
.linkbox{background:linear-gradient(160deg,#f4ecdd,#f9f6f0)}
.code{font-size:9px;line-height:1.55;white-space:normal;word-break:break-all}

.footer{padding-top:54px}
.footer-grid{gap:48px}
.footer h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em}
.footer p,.footer a{font-size:.72rem}

@media(max-width:980px){
  .hero-copy{min-height:auto}
  .hero-aside{min-height:500px}

}

  .shell{width:min(calc(100% - 24px),var(--max))}

  .panel-headline h2{font-size:1.25rem}
  .product-feature{padding:12px}
}


/* ===== Mobile-first production refinement ===== */
html,body{max-width:100%;overflow-x:hidden}
button,a,input{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
img{max-width:100%}
.mobile-search-btn{display:none}

  :root{--mobile-gutter:16px}

  body{overflow-x:hidden}
  .shell{
    width:calc(100% - (var(--mobile-gutter) * 2));
    max-width:none;
  }

  /* Header: compact, stable and thumb friendly */
  .notice{
    min-height:24px;
    padding:5px 12px;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
  }
  .notice span:first-child,.notice i{display:none}
  .notice span:last-child{
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .header{top:0}
  .header-in{
    height:62px;
    display:flex;
    justify-content:space-between;
    gap:10px;
  }
  .logo{min-width:0;gap:8px}
  .logo-mark{width:36px;height:36px;flex:0 0 36px}
  .logo-mark:before{width:14px;height:14px}
  .logo-copy{min-width:0}
  .logo-copy strong{font-size:10px;letter-spacing:.15em}
  .logo-copy small{font-size:6.5px;letter-spacing:.11em;white-space:nowrap}
  .nav{display:none}
  .actions{
    display:flex;
    align-items:center;
    gap:6px;
    flex:0 0 auto;
  }
  .actions .btn{display:none}
  .mobile-search-btn{display:inline-grid;place-items:center}
  .icon-btn{
    width:40px;
    height:40px;
    flex:0 0 40px;
    padding:0;
    font-size:17px;
  }

  /* Home hero: content first, no overflow */
  .hero{padding:12px 0 20px}
  .hero-wrap{display:grid;grid-template-columns:1fr;gap:10px}
  .hero-copy{
    min-height:0;
    padding:28px 22px 24px;
    border-radius:20px;
  }
  .hero-copy:after{
    width:220px;height:220px;right:-110px;bottom:-110px;
    box-shadow:0 0 0 30px rgba(185,138,52,.023),0 0 0 60px rgba(185,138,52,.014);
  }
  .hero-kicker{font-size:8px;letter-spacing:.13em;gap:8px}
  .hero-kicker>span{width:20px}
  .hero h1{
    font-size:clamp(2.75rem,14vw,3.75rem);
    line-height:.9;
    letter-spacing:-.058em;
    margin:15px 0 18px;
    overflow-wrap:anywhere;
  }
  .hero p{
    font-size:.9rem;

    grid-template-columns:repeat(3,minmax(0,1fr));

    padding-top:17px;
  }
  .hero-facts>div{padding-right:8px;min-width:0}
  .hero-facts strong{font-size:.94rem}
  .hero-facts span{
    font-size:7.5px;
    line-height:1.3;

  /* Images stay decorative and compact */
  .hero-aside{

  .hero-note-item small{font-size:7px}
  .hero-note-item strong{font-size:.82rem;margin-top:4px}

  /* Directory */

  /* Featured items become a swipeable row instead of a long stack */

  .detail{padding:14px 0 58px}

function card(r){

  <div class="card-media">
   <img src="${r.image}" alt="" loading="lazy">
   <span class="badge">${esc(r.category)}</span><span class="time">${esc(r.time)}</span>
  </div>
  <div class="card-body">
   <div class="card-meta">${esc(r.body)} · ${esc(r.goal)}</div>
   <h3>${esc(r.title)}</h3>
   <p>${esc(r.short)}</p>
   <div class="card-foot"><span>View resource</span><span class="arrow"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></span></div>
  </div>
 </article>`;
}

function render(){
 const grid=document.getElementById("grid");if(!grid)return;
 const q=search.trim().toLowerCase();
 const list=resources.filter(r=>{
  const ok=filter==="All"||r.category===filter;
  const hay=`${r.title} ${r.category} ${r.body} ${r.goal} ${r.short}`.toLowerCase();
  return ok&&(!q||hay.includes(q));
 });
 grid.innerHTML=list.length?list.map(card).join(""):`<div class="empty"><strong>No matching resources.</strong><span>Try another body area, goal or technique.</span></div>`;
 const count=document.getElementById("resultCount");
 if(count) count.textContent=`${list.length} ${list.length===1?"resource":"resources"}`;
 bindResources();reveal();
}

function bindResources(){
 document.querySelectorAll("[data-resource]").forEach(el=>{
  const fn=()=>openResource(el.dataset.resource);
  el.onclick=fn;
  el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fn()}}
 })
}
function bindHome(){
 document.querySelectorAll("[data-home]").forEach(el=>el.onclick=e=>{e.preventDefault();showHome()})
}
function reveal(){
 const els=document.querySelectorAll(".reveal:not(.show)");
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");io.unobserve(e.target)}}),{threshold:.06});
 els.forEach(x=>io.observe(x))
}
function showHome(push=true){
 if(push)history.pushState({},"","#library");
 app.innerHTML=home();
 const s=document.getElementById("search");
 s.oninput=e=>{search=e.target.value;render()};
 document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{
  filter=b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x.dataset.filter===filter));
  render()
 });
 render();bindResources();bindHome();reveal();
 setTimeout(()=>{if(location.hash==="#library")document.getElementById("library")?.scrollIntoView({behavior:"smooth"})},30)
}
function openResource(slug,push=true){
 const r=bySlug(slug);if(!r)return showHome();
 if(push)history.pushState({slug},"","#"+slug);
 app.innerHTML=detail(r);bindResources();bindHome();reveal();
 const pb=document.getElementById("playBtn");
 if(pb)pb.onclick=()=>{
  pb.closest(".video").innerHTML=`<div style="height:100%;display:grid;place-items:center;color:#fff;text-align:center;padding:24px"><div><div class="eyebrow" style="color:#dcbf78">Video Placeholder</div><h2 style="margin:10px 0 5px">${esc(r.title)}</h2><p style="color:#aaa;margin:0">YouTube, Vimeo or hosted video appears here.</p></div></div>`;
 };
 const cb=document.getElementById("copyBtn");
 if(cb)cb.onclick=async()=>{
  const link=`https://youngaf.vip/fascia-fix-videos/${r.slug}/`;
  try{await navigator.clipboard.writeText(link)}catch(e){}
  notify("Resource link copied")
 };
 const prod=document.getElementById("productBtn");
 if(prod)prod.onclick=()=>notify("Product details would open here");
 window.scrollTo({top:0,behavior:"smooth"})
}
function notify(msg){
 toast.textContent=msg;toast.classList.add("show");
 clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove("show"),1600)
}
window.addEventListener("popstate",route);
function route(){
 const h=location.hash.replace("#","");
 if(!h||["library","featured"].includes(h))showHome(false);
 else if(bySlug(h))openResource(h,false);
 else showHome(false)
}
route();
